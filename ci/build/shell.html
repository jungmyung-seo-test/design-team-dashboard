<title>BiznP Product Design</title>
<style>
/* ============================================================
   Apple HIG-derived token set.
   Light palette on bare :root; dark redefines tokens only.
   ============================================================ */
:root{
  /* system colors — light */
  --blue:#007AFF; --green:#34C759; --orange:#FF9500; --red:#FF3B30;
  --teal:#30B0C7; --indigo:#5856D6; --gray:#8E8E93;

  /* backgrounds */
  --bg:#F4F4F4;
  --surface:#FFFFFF;
  --fill:rgba(125,125,125,.13);
  --fill-2:rgba(125,125,125,.09);
  --bar:rgba(250,250,250,.82);

  /* labels */
  --ink:#000000;
  --ink-2:rgba(63,63,63,.62);
  --ink-3:rgba(63,63,63,.36);
  --sep:rgba(63,63,63,.20);
  --sep-strong:rgba(63,63,63,.32);

  --accent:var(--ink); --accent-ink:var(--ink);
  --accent-soft:rgba(0,0,0,.10);

  /* load states — semantic, ordinal */
  --l0:#248A3D; --l0-bg:rgba(52,199,89,.14);
  --l1:#55555A; --l1-bg:rgba(120,120,120,.15);
  --l2:#B25000; --l2-bg:rgba(255,149,0,.16);
  --l3:#C6362C; --l3-bg:rgba(255,59,48,.13);

  /* work-type categories — fixed order, always directly labeled */
  --t0:#007AFF; --t1:#30B0C7; --t2:#34C759; --t3:#5856D6; --t4:#FF9500; --t5:#AEAEB2; --t6:#D93A2E;
  --w0:#F24822; --w1:#18A0FB; --w2:#1BC47D;   /* 업무 유형: 프로덕트 · FT · 운영 */

  --lift:0 .5px 1.5px rgba(0,0,0,.05);
  --sheet:0 0 0 .5px rgba(0,0,0,.06), -18px 0 48px rgba(0,0,0,.12);
  --r-lg:12px;   /* 컨테이너: 패널·카드·컬럼·시트 */
  --r:8px;       /* 컨트롤: 탭·칩·입력·버튼 */
  --r-sm:5px;    /* 인라인: 배지·태그·미터 */
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A;
    --teal:#40C8E0; --indigo:#5E5CE6; --gray:#98989D;

    --bg:#000000;
    --surface:#1C1C1C;
    --fill:rgba(128,128,128,.26);
    --fill-2:rgba(128,128,128,.18);
    --bar:rgba(28,28,28,.78);

    --ink:#FFFFFF;
    --ink-2:rgba(240,240,240,.60);
    --ink-3:rgba(240,240,240,.34);
    --sep:rgba(86,86,86,.58);
    --sep-strong:rgba(86,86,86,.82);

    --accent-soft:rgba(255,255,255,.18);

    --l0:#30D158; --l0-bg:rgba(48,209,88,.18);
    --l1:#ADADAD; --l1-bg:rgba(160,160,160,.20);
    --l2:#FF9F0A; --l2-bg:rgba(255,159,10,.20);
    --l3:#FF6961; --l3-bg:rgba(255,69,58,.20);

    --t0:#0A84FF; --t1:#40C8E0; --t2:#30D158; --t3:#5E5CE6; --t4:#FF9F0A; --t5:#636366; --t6:#FF453A;
    --w0:#F24822; --w1:#18A0FB; --w2:#1BC47D;

    --lift:none;
    --sheet:0 0 0 .5px rgba(255,255,255,.10), -18px 0 48px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A;
  --teal:#40C8E0; --indigo:#5E5CE6; --gray:#98989D;
  --bg:#000000; --surface:#1C1C1C;
  --fill:rgba(128,128,128,.26); --fill-2:rgba(128,128,128,.18);
  --bar:rgba(28,28,28,.78);
  --ink:#FFFFFF; --ink-2:rgba(240,240,240,.60); --ink-3:rgba(240,240,240,.34);
  --sep:rgba(86,86,86,.58); --sep-strong:rgba(86,86,86,.82);
  --accent-soft:rgba(255,255,255,.18);
  --l0:#30D158; --l0-bg:rgba(48,209,88,.18);
  --l1:#ADADAD; --l1-bg:rgba(160,160,160,.20);
  --l2:#FF9F0A; --l2-bg:rgba(255,159,10,.20);
  --l3:#FF6961; --l3-bg:rgba(255,69,58,.20);
  --t0:#0A84FF; --t1:#40C8E0; --t2:#30D158; --t3:#5E5CE6; --t4:#FF9F0A; --t5:#636366; --t6:#FF453A;
    --w0:#F24822; --w1:#18A0FB; --w2:#1BC47D;
  --lift:none;
  --sheet:0 0 0 .5px rgba(255,255,255,.10), -18px 0 48px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",
              "Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",
              "Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.47; letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
h1,h2,h3{margin:0; text-wrap:balance}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; letter-spacing:inherit}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:var(--r)}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:0}

/* ---------- toolbar ---------- */
header.top{
  position:sticky; top:0; z-index:40;
  background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 .5px 0 var(--sep);
}
header.top .top-in{max-width:1560px; margin:0 auto; padding:18px 24px 0}
.brandrow{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px}
h1{font-size:26px; font-weight:700; letter-spacing:-.024em}
.synced{font-size:12.5px; color:var(--ink-3)}
.synced .num{color:var(--ink-2)}
/* '지금 갱신' — META.refreshApi 가 있을 때만 보인다 */
.refresh{
  font-size:12px; font-weight:500; font-family:inherit; color:var(--accent);
  background:none; text-decoration:none; cursor:pointer;
  border:.5px solid var(--sep); border-radius:var(--r-sm); padding:2px 8px; white-space:nowrap;
}
.refresh:hover:not([disabled]){background:var(--fill-2)}
.refresh[disabled]{color:var(--ink-3); cursor:default}
.refresh[hidden]{display:none}
.refresh .dot{
  display:inline-block; width:6px; height:6px; margin-right:5px; border-radius:50%;
  background:currentColor; animation:rpulse 1.1s ease-in-out infinite;
}
@keyframes rpulse{0%,100%{opacity:.25} 50%{opacity:1}}
@media (prefers-reduced-motion:reduce){ .refresh .dot{animation:none; opacity:.6} }

/* segmented control */
.tabs{
  display:inline-flex; gap:2px; margin:14px 0 14px;
  background:var(--fill-2); border-radius:10px; padding:2px;
}
.tab{
  padding:6px 16px; font-size:13.5px; font-weight:500; color:var(--ink);
  border-radius:var(--r); white-space:nowrap; transition:background .15s, color .15s;
}
.tab:hover{background:var(--fill-2)}
.tab[aria-selected="true"]{
  background:var(--ink); color:var(--surface); font-weight:600;
}
.tab[aria-selected="true"]:hover{background:var(--ink)}

/* ---------- filters ---------- */
.flabel{font-size:12px; color:var(--ink-2); font-weight:500}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  padding:5px 13px; font-size:13px; border-radius:var(--r); white-space:nowrap;
  background:var(--fill-2); color:var(--ink); transition:background .13s, color .13s;
}
.chip:hover{background:var(--fill)}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--surface); font-weight:600}
.chip[aria-pressed="true"]:hover{background:var(--ink)}
select,input[type="search"]{
  font:inherit; font-size:13.5px; padding:6px 11px; border:none; border-radius:var(--r);
  background:var(--fill-2); color:var(--ink); -webkit-appearance:none; appearance:none;
}
select{padding-right:26px; background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 14px) 52%, calc(100% - 9px) 52%; background-size:5px 5px,5px 5px; background-repeat:no-repeat}
input[type="search"]{min-width:220px}
input::placeholder{color:var(--ink-3)}
.spacer{flex:1}

main{max-width:1560px; margin:0 auto; padding:20px 24px 80px}
.view[hidden]{display:none}

/* ---------- board (One 탭과 같은 컬럼·카드 문법) ---------- */
.board{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); gap:10px; align-items:start}
.col{
  min-width:0; background:var(--fill-2); border-radius:var(--r-lg); padding:8px;
  display:flex; flex-direction:column; gap:7px;
}
.colhead{display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:4px 5px 8px}
.colhead h2{font-size:17px; font-weight:600; letter-spacing:-.02em}
.colmeta{font-family:var(--mono); font-size:11.5px; color:var(--ink-2); letter-spacing:0; white-space:nowrap}
.cards{display:flex; flex-direction:column; gap:7px}

.card{
  width:100%; text-align:left; background:var(--surface); border:none;
  border-radius:var(--r); padding:11px 12px 10px; display:flex; flex-direction:column; gap:9px;
  box-shadow:0 .5px 1.5px rgba(0,0,0,.06); transition:transform .14s, box-shadow .14s;
}
button.card:hover{transform:translateY(-1px); box-shadow:0 4px 12px rgba(0,0,0,.10)}
button.card:active{transform:scale(.99)}
.card.sel{box-shadow:0 0 0 3px var(--accent-soft), 0 0 0 1px var(--accent)}
.card.mgr{cursor:default}
.card.mgr:hover{transform:none}

/* 컬럼이 좁아져도 이름은 쪼개지지 않게 — 대신 상태 뱃지가 아랫줄로 내려간다 */
.card-top{display:flex; align-items:center; justify-content:space-between; gap:4px 8px; flex-wrap:wrap}
.who{display:flex; align-items:baseline; gap:7px; min-width:0; flex-wrap:wrap}
.nm{font-size:14px; font-weight:600; letter-spacing:-.012em; white-space:nowrap}
.lv{font-size:10.5px; color:var(--ink-3); white-space:nowrap}
.state{display:flex; align-items:center; gap:7px; margin-left:auto}
.pill{font-size:11px; font-weight:600; padding:1px 7px; border-radius:var(--r-sm); white-space:nowrap}
.meter{display:flex; gap:2px}
.seg{width:4px; height:11px; border-radius:2px; background:var(--fill)}

/* 좌: 라벨 / 우: 값 — One 카드의 foot 행과 같은 정렬 */
.crow{
  display:flex; align-items:baseline; justify-content:space-between; gap:4px 10px;
  font-size:11.5px; color:var(--ink-2);
  flex-wrap:wrap;   /* 패널이 열려 컬럼이 좁아지면 값이 아래 줄로 내려간다 */
}
.crow > span:first-child{white-space:nowrap; flex:none}
.crow .v{text-align:right}
.crow .v{font-family:var(--mono); letter-spacing:0; color:var(--ink); min-width:0}
.crow .v.dim{color:var(--ink-2)}
.crow .tset{display:inline-flex; align-items:center; gap:6px 11px; flex-wrap:wrap; justify-content:flex-end}
.tcount{display:inline-flex; align-items:center; gap:4px; color:var(--ink)}
.tcount svg{display:block; flex:none}
.crow.lead{padding-top:2px}

.field{display:flex; gap:8px; font-size:12px; line-height:1.4}
.fk{color:var(--ink-2); flex:0 0 auto; width:58px; font-size:11px; padding-top:1px; white-space:nowrap}
.fv{color:var(--ink); min-width:0}
.tags{display:flex; flex-wrap:wrap; gap:4px}
.tag{background:var(--fill-2); border-radius:var(--r-sm); padding:1px 6px; font-size:11px; color:var(--ink)}
.none{color:var(--ink-3); font-size:11.5px}
.note{font-size:11.5px; color:var(--ink-2); background:var(--fill-2); padding:5px 8px; border-radius:var(--r-sm)}

/* ---------- panels / grouped lists ---------- */
.panel{background:var(--surface); border-radius:var(--r-lg); padding:18px 20px; box-shadow:var(--lift)}
.panel + .panel{margin-top:16px}
.ph{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px 20px; margin-bottom:6px}
.ph h2{font-size:19px; font-weight:600; letter-spacing:-.021em}
.sub{font-size:13px; color:var(--ink-2); max-width:66ch}
.hint{font-size:12.5px; color:var(--ink-2); margin:-3px 0 10px; line-height:1.45}


/* ---------- One board (Jira-style) ---------- */
.onebar{background:var(--surface); border-radius:var(--r-lg); padding:12px 14px; box-shadow:var(--lift); display:flex; flex-direction:column; gap:10px}
.onebar-row{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px}
.onecount{font-size:12.5px; color:var(--ink-2)}
.onecount b{font-family:var(--mono); color:var(--ink); font-weight:600; letter-spacing:0}


.kanban{
  display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr);
  gap:10px; align-items:start;
}
.kcol{
  min-width:0; background:var(--fill-2); border-radius:var(--r-lg); padding:8px;
  display:flex; flex-direction:column; gap:7px; min-height:64px;
}
.kcol.empty{opacity:.5; min-height:0}
.kchead{display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:2px 4px 4px}
.kchead .kn{font-size:12px; font-weight:600; letter-spacing:.01em}
.kchead .kc{font-family:var(--mono); font-size:11px; color:var(--ink-2); letter-spacing:0}

.kcard{
  display:block; background:var(--surface); border-radius:var(--r); padding:11px 12px 10px; text-decoration:none;
  color:var(--ink); box-shadow:0 .5px 1.5px rgba(0,0,0,.06); transition:transform .14s, box-shadow .14s;
}
.kcard:hover{transform:translateY(-1px); box-shadow:0 4px 12px rgba(0,0,0,.10)}
.kcard:hover .kt{text-decoration:underline; text-underline-offset:2px}
.kcard .kt{font-size:13px; line-height:1.42; display:block; letter-spacing:-.008em;
  word-break:keep-all; overflow-wrap:anywhere}
.kfoot{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:11px}
.kid{display:inline-flex; align-items:center; gap:6px; min-width:0}
.kico{flex:none; display:block}
.kkey{font-family:var(--mono); font-size:11.5px; color:var(--ink-2); letter-spacing:0}
.kname{font-size:11.5px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.kmore{
  order:2;
  font-size:12px; color:var(--accent); text-align:center; padding:7px 0 3px; cursor:pointer;
  list-style:none; font-weight:500;
}
.kmore::-webkit-details-marker{display:none}
.kempty{font-size:11.5px; color:var(--ink-3); padding:6px 4px 8px; text-align:center}

/* ---------- work types ---------- */
.legend{display:flex; flex-wrap:wrap; gap:6px 16px; margin:12px 0 16px}
.lg{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink)}
.sw{width:10px; height:10px; border-radius:var(--r-sm); flex:none}
.wrow{display:grid; grid-template-columns:130px minmax(0,1fr); gap:14px; align-items:center; padding:5px 0}
.wname{display:flex; align-items:baseline; gap:8px; justify-content:flex-start; font-size:13.5px}
.wname .u{font-size:11px; color:var(--ink-2)}
.bar{display:flex; height:22px; border-radius:var(--r); overflow:hidden; background:var(--fill-2)}
.seg2{display:flex; align-items:center; justify-content:center; min-width:0; color:#fff; font-size:11px; font-weight:600; font-family:var(--mono); letter-spacing:0}
.wempty{font-size:12.5px; color:var(--ink-3)}
.grouphead{
  font-size:12px; letter-spacing:.02em; color:var(--ink-2); font-weight:600;
  margin:18px 0 6px; padding-bottom:6px; box-shadow:inset 0 -.5px 0 var(--sep);
}

/* ---------- sheet ---------- */
/* 상세 패널은 보드 위에 고정(dock)된다 — 딤을 씌우지 않고 좌측에서 담당자를 계속 고를 수 있게. */
:root{--drw:min(440px,44vw)}
body{transition:padding-right .38s cubic-bezier(.32,.72,0,1)}
@media (min-width:721px){
  body.docked{padding-right:var(--drw)}
  .scrim{display:none !important}   /* 데스크톱에선 보드를 막지 않는다 */
}
.scrim{position:fixed; inset:0; background:rgba(0,0,0,.28); z-index:50; opacity:0; transition:opacity .3s cubic-bezier(.32,.72,0,1)}
.scrim.on{opacity:1}
.scrim[hidden]{display:none}
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:var(--drw); z-index:51;
  background:var(--surface); box-shadow:var(--sheet); border-radius:var(--r-lg) 0 0 var(--r-lg);
  display:flex; flex-direction:column; transform:translateX(100%);
  transition:transform .38s cubic-bezier(.32,.72,0,1);
}
.drawer.on{transform:none}
.drawer[hidden]{display:none}
.dhead{
  padding:16px 20px 13px; box-shadow:inset 0 -.5px 0 var(--sep);
  display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
}
.dunit{display:flex; align-items:center; flex-wrap:wrap; gap:4px 8px; margin-top:4px}
.dunit .du{font-size:12px; color:var(--ink-3)}
.dbody{padding:18px 20px 48px; overflow-y:auto; display:flex; flex-direction:column; gap:24px; -webkit-overflow-scrolling:touch}
.close{
  width:28px; height:28px; border-radius:var(--r); background:var(--fill); color:var(--ink-2);
  font-size:16px; line-height:1; display:flex; align-items:center; justify-content:center; flex:none;
}
.close:hover{background:var(--fill); color:var(--ink)}
.dsec h3{font-size:13px; color:var(--ink-2); font-weight:600; margin-bottom:10px; letter-spacing:-.006em}
.kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.kpi{background:var(--fill-2); border-radius:var(--r); padding:10px 12px}
.kpi .v{font-family:var(--mono); font-size:21px; font-weight:600; line-height:1.15; letter-spacing:-.01em}
.kpi .k{font-size:11.5px; color:var(--ink-2); margin-top:2px}
.kpi .k .sub2{display:block; font-size:10.5px; color:var(--ink-3); margin-top:1px}
.tlist{display:flex; flex-direction:column; gap:7px}
.trow{display:grid; grid-template-columns:12px minmax(0,1fr) auto; gap:9px; align-items:center; font-size:13.5px}
.trow .pct{color:var(--ink); font-weight:600; margin-left:2px}
button.trow{width:100%; text-align:left; padding:3px 6px; margin:0 -6px; border-radius:var(--r-sm); cursor:pointer}
button.trow:hover{background:var(--fill-2)}
button.trow.on{background:var(--fill); font-weight:600}
button.seg2{cursor:pointer; border:none; transition:filter .13s}
button.seg2:hover{filter:brightness(1.12)}
.wtfilter{color:var(--ink); font-weight:600}
button.clearwt{font-size:12.5px; color:var(--accent); text-decoration:underline; text-underline-offset:2px; cursor:pointer; padding:0}
.bar.mini{height:20px; margin-top:12px}
.trow .n{font-family:var(--mono); color:var(--ink-2); font-size:12.5px; letter-spacing:0}

a{color:var(--accent)}
a.jira{
  display:inline-flex; align-items:center; gap:6px; font-size:13px; text-decoration:none;
  border-radius:var(--r); padding:6px 14px; background:var(--fill-2); color:var(--accent); font-weight:500;
}
a.jira:hover{background:var(--fill); text-decoration:underline; text-underline-offset:2px}
a.jira .arw{opacity:.55; font-size:11px}
.jirarow{display:flex; flex-wrap:wrap; gap:8px}

.stgroup + .stgroup{margin-top:16px}
.sthead{display:flex; align-items:baseline; gap:8px; font-size:14.5px; font-weight:600; margin-bottom:6px; letter-spacing:-.012em}
.sthead .cnt{font-family:var(--mono); font-weight:400; color:var(--ink-2); font-size:13px; letter-spacing:0}
.ilist,.elist{display:flex; flex-direction:column}
.irow,.erow{
  display:grid; grid-template-columns:minmax(0,1fr); gap:10px; align-items:baseline;
  padding:9px 0; box-shadow:inset 0 .5px 0 var(--sep);
}
.irow:first-child,.erow:first-child{box-shadow:none}
details.drow > summary{
  list-style:none; cursor:pointer;
  grid-template-columns:minmax(0,1fr) 26px;
}
details.drow > summary::-webkit-details-marker{display:none}
details.drow > summary:hover{background:var(--fill-2)}
.chev{
  width:26px; height:26px; align-self:center; position:relative; opacity:.5;
  transition:transform .16s; border-radius:var(--r-sm);
}
details.drow > summary:hover .chev{opacity:.9; background:var(--fill)}
.chev::before{
  content:""; position:absolute; left:9px; top:10px; width:6px; height:6px;
  border-right:1.6px solid currentColor; border-bottom:1.6px solid currentColor;
  transform:rotate(45deg);
}
details.drow[open] > summary .chev{transform:rotate(180deg)}
.kidlist{
  margin:2px 0 6px 14px; padding-left:12px;

<script>
/* ===== DATA ===== */
__DATA__

/* ===== CONFIG ===== */
const UNITS = ["Core UX Design","Discovery Design","Commerce Design","Engagement Design"];
const WTYPES = [
  {k:"프로덕트 과제", v:"--w0"},   // 최상위 조상이 TM Initiative
  {k:"FT 과제",      v:"--w1"},   // 최상위 조상이 FT Initiative
  {k:"운영·KTLO",    v:"--w2"},   // 그 외 전부
];

/* v2 집계 — 카드·상세의 모든 수치를 DESIGN(좁힌 범위)에서 직접 낸다.
   범위: 2026-07-01 이후 생성 + 상태 In Design / 완료 / SUGGESTED.
   LOAD(v1용 롤업 집계)와 섞지 않아야 화면의 숫자끼리 맞는다. */
function dstat(name){
  const D = DESIGN[name] || [];
  const by = b => D.filter(x => x.b === b);
  const md = r => ({ sum: Math.round(r.reduce((a,x) => a + (x.e || 0), 0) * 100) / 100,
                     filled: r.filter(x => x.e != null).length, total: r.length });
  const a = by("active"), d = by("done");
  /* 프로젝트 단위 = 가장 가까운 상위 Epic. 진행 중 실무가 달린 Epic만 세어지므로,
     "지금 손이 들어가 있는 프로젝트 수"가 된다. 상위가 없으면 그 티켓 자체가 한 프로젝트.
     (`x.pj`는 최상위 Initiative로 묶은 값 — 데이터에는 있으나 지금은 쓰지 않는다.) */
  const eps = new Set(); let solo = 0;
  a.forEach(x => x.up ? eps.add(x.up.k) : solo++);
  const proj = eps.size + solo;
  return { total:D.length, active:a.length, todo:by("todo").length,
           backlog:by("backlog").length, hold:by("hold").length, done:d.length,
           mdActive:md(a), mdDone:md(d),
           load:{ tasks:a.length, proj, score:Math.round((a.length + proj * 1.5) * 10) / 10 } };
}

/* v2 주간 업무 부하 — MD 기입에 의존하지 않는 공식 (2026-08-31 확정)
     점수 = 진행 중 Task 수 + (서로 다른 상위 프로젝트 수 × 1.5)
   1.5는 프로젝트가 바뀔 때 드는 커뮤니케이션·미팅·스펙 파악 비용 계수다.
   상위(Epic/Initiative)가 없는 티켓은 각각 하나의 독립 프로젝트로 센다.
   구간은 가용 공수 1주 5 MD(순수 몰입 3.5 MD + 소통) 기준. */
const LOADLEVELS2 = [
  {lt:4.5,       label:"여유",   i:0, t:"--l0"},   // 4.5 미만
  {lt:7.6,       label:"보통",   i:1, t:"--l1"},   // 4.5 ~ 7.5
  {lt:9.6,       label:"많음",   i:2, t:"--l2"},   // 7.6 ~ 9.5
  {lt:Infinity,  label:"과부하", i:3, t:"--l3"},   // 9.6 이상
];
const loadOf2 = S => LOADLEVELS2.find(l => S.load.score < l.lt);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const blank = {total:0,active:0,done:0,todo:0,mdSum:0,mdFilled:0,mdTotal:0,types:{},epics:[]};
const ld = n => LOAD[n] || blank;

document.getElementById("mSynced").textContent = META.fetchedAt;
/* '지금 갱신'
   브라우저는 지라를 직접 부르지 않는다 — 토큰이 페이지에 박히고 CORS 도 막힌다.
   대신 Cloudflare Worker 에 "갱신해 줘"라고만 말한다. Worker 가 GitHub 토큰을 쥐고
   Actions 워크플로를 실행하면, 그 워크플로가 지라를 조회해 이 페이지를 다시 만들어
   Pages 에 배포한다. 2~3분 걸리므로 끝날 때까지 status.json 을 폴링한다.
   META.refreshApi 가 없으면 버튼은 숨은 채로 남는다. */
(function(){
  const rb = document.getElementById("mRefresh");
  if (!META.refreshApi) return;
  rb.hidden = false;
  rb.title = "지라를 다시 조회해 보드를 새로 만듭니다 (2~3분)";

  const POLL = 5000, LIMIT = 8 * 60 * 1000;
  let busy = false;

  const label = (t, spin) => {
    rb.innerHTML = "";
    if (spin) { const d = document.createElement("span"); d.className = "dot"; rb.appendChild(d); }
    rb.appendChild(document.createTextNode(t));
  };
  const idle = t => { busy = false; rb.disabled = false; label(t || "지금 갱신", false); };

  /* 배포가 끝나면 status.json 의 스냅샷 시각이 바뀐다. 그때 새로고침한다.
     비밀번호는 같은 탭 sessionStorage 에 있어 다시 묻지 않는다. */
  async function poll(started){
    if (Date.now() - started > LIMIT) {
      idle("시간 초과 · 다시 시도");
      return;
    }
    try {
      const r = await fetch("status.json?t=" + Date.now(), {cache:"no-store"});
      if (r.ok) {
        const s = await r.json();
        if (s.fetchedAt && s.fetchedAt !== META.fetchedAt) {
          /* location.reload() 를 쓰지 않는다. GitHub Pages 는 index.html 에 캐시 헤더를
             달아 주므로, 새로 배포된 직후에도 재요청이 옛 페이지를 그대로 돌려줄 수 있다.
             그러면 "버튼은 도는데 갱신 시각도 내용도 그대로"가 된다.
             쿼리를 붙여 다른 URL 로 만들면 캐시를 확실히 비켜간다. */
          const u = new URL(location.href);
          u.searchParams.set("v", s.buildId || s.fetchedAt);
          location.replace(u.toString());
          return;
        }
      }
    } catch (e) { /* 배포 중에는 잠깐 실패할 수 있다. 계속 기다린다. */ }
    const mins = Math.floor((Date.now() - started) / 60000);
    label(mins >= 1 ? `갱신 중… ${mins}분` : "갱신 중…", true);
    setTimeout(() => poll(started), POLL);
  }

  rb.addEventListener("click", async () => {
    if (busy) return;
    busy = true; rb.disabled = true; label("요청 중…", true);
    try {
      const r = await fetch(META.refreshApi, {method:"POST", headers:{"Content-Type":"application/json"}});
      if (!r.ok) throw new Error(r.status);
      poll(Date.now());                 // 이미 돌고 있던 경우(already)도 그대로 기다리면 된다
    } catch (e) {
      idle("요청 실패 · 다시 시도");
    }
  });
})();

const isMgr = n => MANAGERS.includes(n);
const TICO = {
  Initiative: {c:"#E5493A", d:"M8.9 3.4 5.1 8.75h2.3L7 12.6l3.9-5.35H8.6z"},
  Epic:       {c:"#904EE2", d:"M8.9 3.4 5.1 8.75h2.3L7 12.6l3.9-5.35H8.6z"},
  Design:     {c:"#4E9F2F", d:"M5.4 4.3h5.2v7.4L8 9.35 5.4 11.7z"},
};
const typeMark = t => {
  const s = TICO[t];
  return `<svg viewBox="0 0 16 16" width="12" height="12" aria-label="${t}" role="img">
    <rect x="1.1" y="1.1" width="13.8" height="13.8" rx="4" fill="none" stroke="${s.c}" stroke-width="1.6"/>
    <path d="${s.d}" fill="${s.c}"/></svg>`;
};
const members = arr => arr.filter(p => !isMgr(p.name));

const issueUrl = k => `${JIRA}/browse/${encodeURIComponent(k)}`;
/* v2 범위 시작일 — 집계(agg)의 V2FROM과 같은 값이어야 한다 */
const V2FROM = "2026-07-01";

/* v2 상단 유형 행 — 유형 하나만 걸러서 본다. 상태는 가리지 않는다.
   조회 범위(created·resolved)는 집계와 같게 맞춰야 화면의 숫자와 링크 결과가 일치한다. */
function typeUrl(name, types){
  const acct = ACCT[name];
  if (!acct) return null;
  const q = s => `"${s}"`;
  /* 날짜는 v2 목록과 같은 V2FROM. 여기가 어긋나면 유형 행 숫자와 아래 목록 수가 안 맞는다. */
  const jql = `assignee = ${q(acct)} AND issuetype in (${types.map(q).join(", ")})`
    + ` AND created >= ${q(V2FROM)}`
    + ` AND (statusCategory != Done OR resolved >= ${q(META.doneFrom || "2026-07-01")})`
    + ` ORDER BY status ASC, updated DESC`;
  return `${JIRA}/issues/?jql=${encodeURIComponent(jql)}`;
}


const visible = () => TEAM;

/* ===== HEADER ===== */
/* ===== TABS ===== */
document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === t));
    ["board","one","types"].forEach(v => document.getElementById("view-"+v).hidden = (v !== t.dataset.view));
    closeDrawer();   /* 탭을 바꾸면 열려 있던 담당자 상세는 닫는다 */
    render();
  };
});
const currentView = () => document.querySelector('.tab[aria-selected="true"]').dataset.view;

/* ===== BOARD ===== */
function mgrCardHTML(p){
  const tagList = a => a && a.length
    ? `<div class="tags">${a.map(x => `<span class="tag">${esc(x)}</span>`).join("")}</div>` : "";
  const hasRole = (p.focus && p.focus.length) || (p.services && p.services.length);
  return `
  <div class="card mgr">
    <div class="card-top">
      <span class="who"><span class="nm">${esc(p.name)}</span></span>
    </div>
    ${hasRole ? `<div class="field"><span class="fk">전문 영역</span><span class="fv">${tagList(p.focus)}</span></div>
      <div class="field"><span class="fk">담당 서비스</span><span class="fv">${tagList(p.services)}</span></div>` : ""}
    ${p.note ? `<div class="note">${esc(p.note)}</div>` : ""}
  </div>`;
}

function cardHTML(p){
  if (isMgr(p.name)) return mgrCardHTML(p);
  const L = ld(p.name), S = dstat(p.name);
  const lv = loadOf2(S), lvT = lv.t;
  const segs = [0,1,2,3].map(i =>
    `<span class="seg" style="${i <= lv.i ? `background:var(${lvT})` : ""}"></span>`).join("");
  const tagList = a => a && a.length
    ? `<div class="tags">${a.map(x => `<span class="tag">${esc(x)}</span>`).join("")}</div>`
    : `<span class="none">정보 없음</span>`;
  const hasRole = (p.focus && p.focus.length) || (p.services && p.services.length);
  const c = L.own7 || {};
  const design = ["Design","Task","부작업","작업"].reduce((a,k) => a + (c[k]||0), 0);
  const comp = `<span class="tcount">${typeMark("Initiative")}${c.Initiative||0}</span>`
             + `<span class="tcount">${typeMark("Epic")}${c.Epic||0}</span>`
             + `<span class="tcount">${typeMark("Design")}${design}</span>`;
  return `
  <button class="card" data-name="${esc(p.name)}">
    <div class="card-top">
      <span class="who">
        <span class="nm">${esc(p.name)}</span>
        <span class="lv">${esc(p.role || "")}</span>
      </span>
      <span class="state">
        <span class="pill" style="color:var(${lvT}); background:var(${lvT}-bg)">${lv.label}</span>
        <span class="meter" aria-hidden="true">${segs}</span>
      </span>
    </div>
    ${hasRole ? `<div class="field"><span class="fk">전문 영역</span><span class="fv">${tagList(p.focus)}</span></div>
      <div class="field"><span class="fk">담당 서비스</span><span class="fv">${tagList(p.services)}</span></div>` : ""}
    ${S.total === 0
      ? `<div class="crow lead"><span class="none">담당 티켓 없음</span></div>`
      : `<div class="crow lead"><span>진행 중</span><span class="v">${S.active}건</span></div>
         <div class="crow"><span>진행 중 프로젝트</span><span class="v">${S.load.proj}개</span></div>
         <div class="crow"><span>담당 티켓</span><span class="v dim tset">${comp}</span></div>`}
    ${p.note ? `<div class="note">${esc(p.note)}</div>` : ""}
  </button>`;
}

function renderBoard(){
  const vis = visible();
  document.getElementById("board").innerHTML = UNITS.map(u => {
    const ppl = vis.filter(p => p.unit === u);
    const mem = members(ppl), mg = ppl.filter(p => isMgr(p.name));
    return `<div class="col">
      <div class="colhead">
        <h2>${u}</h2>
        <span class="colmeta">${ppl.length}명</span>
      </div>
      <div class="cards">${ppl.length ? [...mg, ...mem].map(x => cardHTML(x)).join("") : `<p class="none" style="padding:6px 3px">해당하는 인원 없음</p>`}</div>
    </div>`;
  }).join("");
  document.querySelectorAll("button.card").forEach(c => c.onclick = () => openDrawer(c.dataset.name));
}

const dg = n => DESIGN[n] || [];

/* ===== ONE BOARD ===== */
const KCOLS = [
  {k:"백로그",      st:["Backlog","SUGGESTED","P-Backlog","기획완료"]},
  {k:"디자인 중",   st:["디자인중","In Design","In Progress"]},
  {k:"디자인 완료", st:["디자인완료","Design Finalization","Hand-Off"]},
  {k:"개발·론치",   st:["개발중","개발완료","론치완료","완료","배포완료"]},
  {k:"중단",       st:["HOLD","Dropped","철회/반려/취소"]},
];
const TEAMQF = ["Core UX Design","Discovery Design","Engagement Design","Commerce Design"];
const QFILTERS = [
  {id:"FT",  label:"FT",       team:false, fn:i => i.pj === "FT"},
  {id:"DEN", label:"ONE",       team:false, fn:i => i.lb.length > 0},
  ...TEAMQF.map(t => ({id:t, label:t, team:true,
                       fn:i => i.a && ONE.groups[t].m.includes(i.a)})),
];
const oneState = {qf:new Set(), q:"", who:""};
const DONE_SHOWN = 12;

const TYPEICON = {
  Initiative: {c:"#E5493A", d:"M8.9 3.4 5.1 8.75h2.3L7 12.6l3.9-5.35H8.6z"},   // FT
  Epic:       {c:"#904EE2", d:"M8.9 3.4 5.1 8.75h2.3L7 12.6l3.9-5.35H8.6z"},   // PD
  Design:     {c:"#4E9F2F", d:"M5.4 4.3h5.2v7.4L8 9.35 5.4 11.7z"},            // PD 디자인 티켓
};
const typeIcon = i => {
  const s = TYPEICON[i.t] || TYPEICON.Design;
  return `<svg class="kico" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
    <rect x="1.1" y="1.1" width="13.8" height="13.8" rx="4" fill="none" stroke="${s.c}" stroke-width="1.5"/>
    <path d="${s.d}" fill="${s.c}"/></svg>`;
};
const kcard = i => `<a class="kcard" href="${issueUrl(i.k)}" target="_blank" rel="noopener">
    <span class="kt">${esc(i.s)}</span>
    <span class="kfoot">
      <span class="kid">${typeIcon(i)}<span class="kkey">${esc(i.k)}</span></span>
      <span class="kname">${i.a ? esc(i.a) : "미할당"}</span>
    </span>
  </a>`;

function oneFiltered(){
  let list = ONE.issues;
  for (const f of QFILTERS) if (oneState.qf.has(f.id)) list = list.filter(f.fn);
  if (oneState.who === null) list = list.filter(i => !i.a);
  else if (oneState.who) list = list.filter(i => i.a === oneState.who);
  if (oneState.q){
    const q = oneState.q;
    list = list.filter(i => (i.k + " " + i.s + " " + (i.a||"") + " " + i.lb.join(" ") + " " + (i.ps||"")).toLowerCase().includes(q));
  }
  return list;
}

function kanban(list){
  const cols = KCOLS.map(c => ({...c, items: list.filter(i => c.st.includes(i.st))}));
  const known = new Set(KCOLS.flatMap(c => c.st));
  const extra = {};
  list.filter(i => !known.has(i.st)).forEach(i => (extra[i.st] = extra[i.st] || []).push(i));
  Object.entries(extra).forEach(([k,items]) => cols.push({k, items}));
  return `<div class="kanban">${cols.map((c,ci) => {
    const n = c.items.length;
    const head = `<div class="kchead"><span class="kn">${esc(c.k)}</span><span class="kc">${n}</span></div>`;
    if (!n) return `<div class="kcol empty">${head}</div>`;
    if (n <= DONE_SHOWN) return `<div class="kcol">${head}${c.items.map(kcard).join("")}</div>`;
    const first = c.items.slice(0, DONE_SHOWN), rest = c.items.slice(DONE_SHOWN);
    return `<div class="kcol">${head}${first.map(kcard).join("")}
      <details class="more"><summary class="kmore"><span class="m-open">${rest.length}건 더 보기</span><span class="m-close">접기</span></summary>
      <div style="display:flex; flex-direction:column; gap:7px; margin-top:7px">${rest.map(kcard).join("")}</div></details></div>`;
  }).join("")}</div>`;
}

function renderOne(){
  const list = oneFiltered();
  document.getElementById("onecount").innerHTML =
    `<b>${list.length}</b> / ${ONE.meta.total}건 · 진행 중 <b>${list.filter(i => i.cat === "진행 중").length}</b>`;

  const html = kanban(list);
  document.getElementById("oneBoard").innerHTML = html || `<p class="none" style="padding:14px 2px">조건에 맞는 티켓이 없습니다.</p>`;
}


(function initOne(){
  const wrap = document.getElementById("qf");
  QFILTERS.forEach(f => {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = f.label; b.setAttribute("aria-pressed","false");
    b.dataset.qf = f.id;
    b.onclick = () => {
      const on = oneState.qf.has(f.id);
      if (f.team) TEAMQF.forEach(t => oneState.qf.delete(t));   // 팀은 한 번에 하나
      on ? oneState.qf.delete(f.id) : oneState.qf.add(f.id);
      wrap.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", oneState.qf.has(c.dataset.qf)));
      renderOne();
    };
    wrap.appendChild(b);
  });
  const who = document.getElementById("onewho");
  const counts = {};
  ONE.issues.forEach(i => { const n = i.a || "미할당"; counts[n] = (counts[n]||0)+1; });
  ONE.assignees.forEach(n => who.add(new Option(`${n} (${counts[n]})`, n)));
  if (counts["미할당"]) who.add(new Option(`미할당 (${counts["미할당"]})`, "_none"));
  who.onchange = () => { oneState.who = who.value === "_none" ? null : who.value; renderOne(); };
  document.getElementById("oneq").oninput = e => { oneState.q = e.target.value.trim().toLowerCase(); renderOne(); };
  document.getElementById("oneJira").href = ONE.meta.board;
})();

/* ===== WORK TYPES ===== */
document.getElementById("legend").innerHTML = WTYPES.map(t =>
  `<span class="lg"><span class="sw" style="background:var(${t.v})"></span>${esc(t.k)}</span>`).join("");

function renderTypes(){
  const vis = visible();
  document.getElementById("typeRows").innerHTML = UNITS.map(u => {
    const ppl = vis.filter(p => p.unit === u);
    if (!ppl.length) return "";
    const mg = ppl.filter(p => isMgr(p.name)), mem = members(ppl);
    const mgLine = mg.length
      ? `<div class="wrow"><span class="wname">${mg.map(p => esc(p.name)).join(", ")}</span><span></span></div>`
      : "";
    return `<div class="grouphead">${u}</div>` + mgLine + mem.map(p => {
      /* v2 상세의 '업무 유형 분포'와 같은 기준으로 센다 — DESIGN(2026-07-01 이후 작업 티켓). */
      const D = dg(p.name), tot = D.length;
      if (!tot) return `<div class="wrow"><span class="wname">${esc(p.name)}</span><span class="wempty">기간 내 작업 티켓 없음</span></div>`;
      const TC = D.reduce((m,x) => (m[x.w] = (m[x.w]||0) + 1, m), {});
      const segs = WTYPES.filter(t => TC[t.k]).map(t => {
        const n = TC[t.k], pct = n / tot * 100, r = Math.round(pct);
        const label = pct >= 8 ? `${r}%` : "";   // 건수는 담당자 상세에서 본다
        return `<button class="seg2 jump" data-name="${esc(p.name)}" data-wt="${esc(t.k)}" style="width:${pct}%; background:var(${t.v})" title="${esc(t.k)} ${n}건 · ${r}% — 클릭하면 티켓 목록">${label}</button>`;
      }).join("");
      return `<div class="wrow">
        <span class="wname">${esc(p.name)}<span class="u num">${tot}건</span></span>
        <span class="bar">${segs}</span>
      </div>`;
    }).join("");
  }).join("") || `<p class="none">해당하는 인원 없음</p>`;
  document.querySelectorAll("#typeRows .jump").forEach(el =>
    el.onclick = () => openDrawer(el.dataset.name, el.dataset.wt));
}

/* ===== DRAWER ===== */

const scrim = document.getElementById("scrim"), drawer = document.getElementById("drawer");
const DOCKED = window.matchMedia("(min-width:721px)");   // 이 폭부터는 보드를 밀어내고 나란히 둔다
let drawerName = null, drawerWT = null;
function openDrawer(name, wt){
  drawerName = name; drawerWT = wt || null;
  renderDrawer();
  scrim.hidden = drawer.hidden = false;
  document.body.classList.add("docked");
  requestAnimationFrame(() => { scrim.classList.add("on"); drawer.classList.add("on"); });
  document.querySelectorAll("button.card").forEach(c => c.classList.toggle("sel", c.dataset.name === name));
  if (!DOCKED.matches) document.getElementById("dClose").focus();   // 데스크톱에선 포커스를 뺏지 않는다
}
function renderDrawer(){
  const name = drawerName;
  const p = TEAM.find(x => x.name === name); if (!p) return;
  const L = ld(name), S = dstat(name), lv = loadOf2(S);
  document.getElementById("dName").textContent = name;
  /* 부하 표기는 카드와 동일한 뱃지 + 미터로 맞춘다. */
  const dsegs = [0,1,2,3].map(i =>
    `<span class="seg" style="${i <= lv.i ? `background:var(${lv.t})` : ""}"></span>`).join("");
  document.getElementById("dUnit").innerHTML =
    `<span class="du">${esc(p.unit)} · ${esc(p.role || "")}</span>
     <span class="state">
       <span class="pill" style="color:var(${lv.t}); background:var(${lv.t}-bg)">${lv.label}</span>
       <span class="meter" aria-hidden="true">${dsegs}</span>
     </span>`;
  const D = dg(name);
  const list = drawerWT ? D.filter(i => i.w === drawerWT) : D;
  const TC = D.reduce((m,x) => (m[x.w] = (m[x.w]||0) + 1, m), {});
  const types = WTYPES.filter(t => TC[t.k]);
  const typeTotal = types.reduce((a,t) => a + TC[t.k], 0) || 1;
  /* 상단 KPI와 아래 목록을 같은 배열에서 그려 순서·구성이 항상 일치하게 한다. */
  const groups = [
    {b:"active",  label:"진행 중", sub:"In Progress"},
    {b:"todo",    label:"대기",    sub:"Suggested"},
    {b:"backlog", label:"백로그",  sub:"Backlog"},
    {b:"hold",    label:"중단",    sub:"Hold"},
    {b:"done",    label:"완료",    sub:"2026.07.01 이후"},
  ];
  /* 티켓 좌측 얇은 라인 = 업무 유형 색. 범례는 위 '업무 유형 분포'와 같은 색을 쓴다. */
  const wtVar = w => (WTYPES.find(t => t.k === w) || {}).v || "--sep";
  const row = i => `<div class="irow v2" style="--wc:var(${wtVar(i.w)})" title="${esc(i.w || "")}"><a class="t" href="${issueUrl(i.k)}" target="_blank" rel="noopener">${esc(i.s)}
        <span class="meta">${typeMark("Design")}<span class="key">${esc(i.k)}</span> · ${esc(i.st)}${i.up ? ` · <span class="up">${esc(i.up.k)}${i.up.s ? " " + esc(i.up.s) : ""}</span>` : ""}</span></a></div>`;
  /* 상태 그룹 안에서도 업무 유형 순서(프로덕트 과제 > FT 과제 > 운영·KTLO)를 따른다. */
  const wtRank = w => { const i = WTYPES.findIndex(t => t.k === w); return i < 0 ? WTYPES.length : i; };
  const block = g => {
    const items = list.filter(i => i.b === g.b)
      .slice().sort((a,b) => wtRank(a.w) - wtRank(b.w) || (a.k < b.k ? -1 : a.k > b.k ? 1 : 0));
    if (!items.length) return "";
    const head = `<div class="sthead">${g.label}<span class="cnt">${items.length}건</span></div>`;
    if (items.length <= 6) return `<div class="stgroup">${head}<div class="ilist">${items.map(row).join("")}</div></div>`;
    const first = items.slice(0,5), rest = items.slice(5);
    return `<div class="stgroup">${head}<div class="ilist">${first.map(row).join("")}</div>
      <details class="more"><summary><span class="m-open">${rest.length}건 더 보기</span><span class="m-close">접기</span></summary><div class="ilist">${rest.map(row).join("")}</div></details></div>`;
  };

  const O7 = L.own7 || {};
  const TYPEROW = [
    {k:"Initiative", t:["Initiative"],               n:O7.Initiative || 0},
    {k:"Epic",       t:["Epic"],                     n:O7.Epic || 0},
    {k:"Design",     t:["Design","Task","부작업","작업"], n:["Design","Task","부작업","작업"].reduce((a,k) => a + (O7[k]||0), 0)},
  ];
  document.getElementById("dBody").innerHTML = `
    ${ACCT[name] ? `<div class="typerow">${TYPEROW.map(x =>
      `<a class="tlink" href="${typeUrl(name, x.t)}" target="_blank" rel="noopener">
         <span class="tk">${x.k}</span>${typeMark(x.k)}<span class="tn">${x.n}</span></a>`).join("")}</div>` : ""}
    <div class="dsec">
      <div class="kpis">
        ${groups.map(g => `<div class="kpi"><div class="v">${S[g.b]}</div><div class="k">${g.label}<span class="sub2">${g.sub}</span></div></div>`).join("")}
      </div>
    </div>
    <div class="dsec">
      <h3>업무 유형 분포</h3>
      ${types.length ? `<div class="tlist">${types.map(t => {
          const n = TC[t.k], pct = Math.round(n / typeTotal * 100);
          return `<button class="trow pick${drawerWT === t.k ? " on" : ""}" data-wt="${esc(t.k)}">
            <span class="sw" style="background:var(${t.v})"></span><span>${esc(t.k)}</span>
            <span class="n">${n}건 <span class="pct">${pct}%</span></span></button>`;
        }).join("")}</div>
        <div class="bar mini">${types.map(t => {
          const n = TC[t.k], pct = n / typeTotal * 100;
          return `<button class="seg2 pick" data-wt="${esc(t.k)}" style="width:${pct}%; background:var(${t.v})" title="${esc(t.k)} ${n}건 · ${Math.round(pct)}%">${pct >= 11 ? Math.round(pct) + "%" : ""}</button>`;
        }).join("")}</div>`
      : `<p class="none">담당 티켓 없음</p>`}
    </div>
    <div class="dsec">
      <h3>작업 티켓${drawerWT ? ` · <span class="wtfilter">${esc(drawerWT)} ${list.length}건</span>` : ""}</h3>
      ${drawerWT ? `<p class="hint"><button class="clearwt">필터 해제 — 전체 ${D.length}건 보기</button></p>` : ""}
      ${list.length ? groups.map(block).join("") : `<p class="none">담당 티켓 없음</p>`}
    </div>`;

  document.querySelectorAll("#dBody summary a").forEach(a => a.onclick = e => e.stopPropagation());
  document.querySelectorAll("#dBody .pick").forEach(el => el.onclick = () => {
    drawerWT = (drawerWT === el.dataset.wt) ? null : el.dataset.wt;
    renderDrawer();
    document.getElementById("dBody").scrollTop = 0;
  });
  const clr = document.querySelector("#dBody .clearwt");
  if (clr) clr.onclick = () => { drawerWT = null; renderDrawer(); };
}
function closeDrawer(){
  document.body.classList.remove("docked");
  scrim.classList.remove("on"); drawer.classList.remove("on");
  setTimeout(() => { scrim.hidden = drawer.hidden = true; }, 200);
  document.querySelectorAll(".card").forEach(c => c.classList.remove("sel"));
}
scrim.onclick = closeDrawer;
document.getElementById("dClose").onclick = closeDrawer;
document.addEventListener("keydown", e => { if (e.key === "Escape" && !drawer.hidden) closeDrawer(); });

/* ===== RENDER ===== */
function render(){
  const v = currentView();
  if (v === "board") renderBoard();
  else if (v === "one") renderOne();
  else renderTypes();
}
render();
</script>
